name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: Format
        run: tofu fmt -check -recursive -diff

      - name: Init
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

      - name: Validate examples
        run: |
          for dir in examples/*/; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --minimum-failure-severity=error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check terraform-docs is current
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: true
